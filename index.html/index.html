<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Education Point - Math Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    background:linear-gradient(135deg,#0066ff,#7b2cff);
}

.game{
    width:100%;
    max-width:520px;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.header{
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    color:#1266f1;
    font-size:28px;
}

.header p{
    color:#777;
    margin-top:5px;
}

.info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:20px;
}

.info-box{
    background:#f1f5ff;
    border-radius:12px;
    padding:10px 5px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.info-box span{
    display:block;
    font-size:17px;
    margin-top:4px;
    color:#1266f1;
}

.timer{
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.timer-bar{
    height:100%;
    width:100%;
    background:#1266f1;
    transition:width 1s linear;
}

.question{
    background:#f7f9ff;
    border-radius:18px;
    padding:25px 15px;
    text-align:center;
    margin-bottom:18px;
}

.question small{
    color:#777;
}

.question h2{
    margin-top:10px;
    font-size:28px;
    color:#222;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    padding:15px;
    border:2px solid #1266f1;
    background:white;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:#1266f1;
    color:white;
}

.correct{
    background:#22b573!important;
    color:white!important;
    border-color:#22b573!important;
}

.wrong{
    background:#e53935!important;
    color:white!important;
    border-color:#e53935!important;
}

#nextBtn{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1266f1;
    color:white;
    font-size:17px;
    cursor:pointer;
    display:none;
}

.result{
    display:none;
    text-align:center;
}

.result h2{
    font-size:30px;
    color:#1266f1;
}

.final-score{
    font-size:45px;
    font-weight:bold;
    color:#22a06b;
    margin:20px;
}

.result button{
    padding:14px 25px;
    border:none;
    border-radius:12px;
    background:#1266f1;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.message{
    margin:10px 0 20px;
    color:#666;
}

.footer{
    text-align:center;
    margin-top:18px;
    color:#888;
    font-size:12px;
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>📚 Education Point</h1>
        <p>🧠 Math Challenge</p>
    </div>

    <div id="gameScreen">

        <div class="info">

            <div class="info-box">
                LEVEL
                <span id="level">1</span>
            </div>

            <div class="info-box">
                ⏱️ TIME
                <span id="time">15</span>
            </div>

            <div class="info-box">
                ❤️ LIVES
                <span id="lives">3</span>
            </div>

            <div class="info-box">
                🪙 COINS
                <span id="coins">0</span>
            </div>

        </div>

        <div class="timer">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <div class="question">

            <small id="questionNumber">
                Question 1
            </small>

            <h2 id="question">
                Loading...
            </h2>

        </div>

        <div class="options" id="options"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Next Question ➜
        </button>

    </div>


    <div class="result" id="result">

        <h2>🎉 Game Complete!</h2>

        <div class="final-score">
            <span id="finalScore">0</span>
        </div>

        <p class="message" id="resultMessage">
            Great Job!
        </p>

        <p>
            🪙 Coins Earned:
            <b id="finalCoins">0</b>
        </p>

        <br>

        <p>
            🏆 High Score:
            <b id="highScore">0</b>
        </p>

        <br>

        <button onclick="restartGame()">
            🔄 Play Again
        </button>

    </div>

    <div class="footer">
        © 2026 Education Point | Learn & Play
    </div>

</div>


<script>

const questions = [

{
    q:"5 + 7 = ?",
    options:["10","11","12","13"],
    answer:"12"
},

{
    q:"8 × 6 = ?",
    options:["42","48","54","56"],
    answer:"48"
},

{
    q:"100 ÷ 5 = ?",
    options:["10","15","20","25"],
    answer:"20"
},

{
    q:"25 - 9 = ?",
    options:["14","15","16","17"],
    answer:"16"
},

{
    q:"12 × 12 = ?",
    options:["124","134","144","154"],
    answer:"144"
},

{
    q:"√81 = ?",
    options:["7","8","9","10"],
    answer:"9"
},

{
    q:"25% of 200 = ?",
    options:["25","40","50","75"],
    answer:"50"
},

{
    q:"2³ = ?",
    options:["6","8","9","12"],
    answer:"8"
},

{
    q:"15 × 4 = ?",
    options:["50","55","60","65"],
    answer:"60"
},

{
    q:"9 × 9 = ?",
    options:["72","81","90","99"],
    answer:"81"
}

];


let current = 0;
let score = 0;
let coins = 0;
let lives = 3;
let level = 1;

let timeLeft = 15;
let timer;

const question =
document.getElementById("question");

const optionsBox =
document.getElementById("options");

const nextBtn =
document.getElementById("nextBtn");


function loadQuestion(){

    clearInterval(timer);

    if(current >= questions.length){
        endGame();
        return;
    }

    const data = questions[current];

    document.getElementById("questionNumber")
        .innerText =
        "Question " + (current + 1);

    question.innerText = data.q;

    document.getElementById("level")
        .innerText = level;

    optionsBox.innerHTML = "";

    nextBtn.style.display = "none";

    timeLeft = 15;

    document.getElementById("time")
        .innerText = timeLeft;

    document.getElementById("timerBar")
        .style.width = "100%";


    data.options.forEach(option => {

        const button =
        document.createElement("button");

        button.className = "option";

        button.innerText = option;

        button.onclick = () =>
        checkAnswer(button,option);

        optionsBox.appendChild(button);

    });


    startTimer();
}


function startTimer(){

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("time")
            .innerText = timeLeft;

        document.getElementById("timerBar")
            .style.width =
            (timeLeft / 15 * 100) + "%";


        if(timeLeft <= 0){

            clearInterval(timer);

            loseLife();

            disableOptions();

            nextBtn.style.display =
                "block";
        }

    },1000);
}


function checkAnswer(button,selected){

    clearInterval(timer);

    const correct =
        questions[current].answer;

    disableOptions();

    if(selected === correct){

        button.classList.add("correct");

        score++;

        coins += 10;

        document.getElementById("coins")
            .innerText = coins;

        playSound(true);

    }else{

        button.classList.add("wrong");

        loseLife();

        playSound(false);

        document.querySelectorAll(".option")
        .forEach(btn => {

            if(btn.innerText === correct){

                btn.classList.add("correct");

            }

        });

    }

    nextBtn.style.display = "block";
}


function disableOptions(){

    document.querySelectorAll(".option")
    .forEach(btn => {

        btn.disabled = true;

    });
}


function loseLife(){

    lives--;

    document.getElementById("lives")
        .innerText =
        "❤️".repeat(lives) ||
        "0";

    if(lives <= 0){

        setTimeout(endGame,500);

    }
}


function nextQuestion(){

    if(lives <= 0){

        endGame();
        return;

    }

    current++;

    if(current % 3 === 0){

        level++;

    }

    loadQuestion();
}


function endGame(){

    clearInterval(timer);

    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";


    document.getElementById("finalScore")
        .innerText =
        score + " / " + questions.length;


    document.getElementById("finalCoins")
        .innerText = coins;


    let oldScore =
        localStorage.getItem("educationPointHighScore")
        || 0;


    if(score > oldScore){

        localStorage.setItem(
            "educationPointHighScore",
            score
        );

        oldScore = score;

        document.getElementById("resultMessage")
            .innerText =
            "🏆 New High Score! Excellent!";

    }else{

        document.getElementById("resultMessage")
            .innerText =
            "👏 Great effort! Keep learning!";

    }


    document.getElementById("highScore")
        .innerText = oldScore;
}


function restartGame(){

    current = 0;
    score = 0;
    coins = 0;
    lives = 3;
    level = 1;

    document.getElementById("coins")
        .innerText = "0";

    document.getElementById("lives")
        .innerText = "3";

    document.getElementById("gameScreen")
        .style.display = "block";

    document.getElementById("result")
        .style.display = "none";

    loadQuestion();
}


function playSound(correct){

    const audio =
    new AudioContext();

    const oscillator =
    audio.createOscillator();

    const gain =
    audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.frequency.value =
        correct ? 700 : 200;

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audio.currentTime + 0.2
    );

    oscillator.stop(
        audio.currentTime + 0.2
    );
}


loadQuestion();

</script>

</body>
</html>
